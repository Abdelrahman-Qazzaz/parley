# The fetcher's lint and format rules, checked in so every machine and the
# pre-commit hook agree. Without this, ruff falls back to its own defaults,
# which change between releases.
target-version = "py314"

# The app imports its own modules as top-level names (`from env import env`),
# as it runs with app/ on PYTHONPATH (see Dockerfile).
src = ["app"]

[lint]
select = [
  "E", "W", # pycodestyle
  "F",      # pyflakes
  "I",      # import order
  "UP",     # newer syntax for the target version
  "B",      # likely bugs
  "SIM",    # simpler equivalents
  "RUF",    # ruff's own
]
