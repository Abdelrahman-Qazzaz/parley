# Supabase's gateway in miniature: Storage under /storage/v1, where supabase-js
# and the signed URLs it hands out expect it.
events {}

http {
  # Over MAX_AUDIO_BYTES, so Storage's own limit is the one that answers.
  client_max_body_size 60m;

  server {
    listen 8000;

    location /storage/v1/ {
      proxy_pass http://storage:5000/;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_set_header Host $host;
    }
  }
}
